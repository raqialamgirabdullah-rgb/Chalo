name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK বিল্ড
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Releases-এ প্রকাশ
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk RickshawRide.apk
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RickshawRide.apk \
            --title "চলো $TAG" \
            --notes "স্বয়ংক্রিয় বিল্ড নম্বর ${{ github.run_number }} (commit ${GITHUB_SHA::7})" \
            --latest

      # বিল্ড ফেল করলে লগ আলাদা ব্রাঞ্চে (build-logs) জমা হয়।
      - name: ত্রুটির লগ সেভ
        if: failure()
        shell: bash
        run: |
          (grep -E "^e: |error:|Unresolved|mismatch|FAILED|What went wrong" -A3 build.log | head -80; echo "---- tail ----"; tail -n 60 build.log) > /tmp/build-error.txt 2>/dev/null || echo "build.log তৈরি হয়নি" > /tmp/build-error.txt
          echo "run: ${{ github.run_number }}  commit: ${GITHUB_SHA}" >> /tmp/build-error.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/build-error.txt build-error.txt
          git add build-error.txt
          git commit -q -m "Build error log (run ${{ github.run_number }})"
          git push --force origin build-logs
